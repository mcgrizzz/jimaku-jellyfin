targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Measure coverage against the correction actually being applied. For a subtitle corrected in
    sections it was measured against the global fit, which is wrong for most of the file by
    construction - so a genuinely differently-cut subtitle read as covering far less dialogue than
    it does, and coverage leads the ranking. The decision was going to whichever file a single
    offset could explain, however badly.
  - Prefer subtitles released against the same source as the local file. Broadcast and disc
    releases are routinely cut differently, which is why two subtitles for one episode can want
    offsets a second apart. This was already detected and used to make the piecewise aligner try
    harder, but had no say in which candidate was chosen. It only breaks a close call.
