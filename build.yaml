version: 27
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Stop the differing-cut aligner rescuing subtitles that do not match at all. It gets a free
    offset per section, so it raises correlation almost by construction - and correlation was the
    only thing refereeing it. A subtitle whose single-offset fit was completely non-unique, the
    signature of the wrong file, came back as a confident two-section match. A split must now also
    put most of the dialogue in the right place, which extra freedom alone cannot achieve.
  - Never attempt a differing-cut match against voice activity. It has no cue structure, so there
    is nothing to check the result against: maximum freedom on the weakest evidence.
  - Say when a split was rejected for fitting noise, and how little of the dialogue it landed on.
