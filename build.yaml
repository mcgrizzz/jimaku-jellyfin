name: "Jimaku"
guid: "9f1c2a3e-6d54-4b07-8e21-5c9a7d3b1f80"
version: 12
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Choose the timing reference by agreement between the embedded tracks, not by cue count. The
    densest track is often the group's own, carrying karaoke and signs and timed differently.
  - Rank candidates on how much dialogue they actually cover, not only on how well they align.
    A subtitle that omits lines and holds them briefly no longer beats a fuller one.
  - Stop demoting subtitles whose filename does not state a language; only bilingual releases
    are ranked down now.
