name: "Jimaku"
guid: "9f1c2a3e-6d54-4b07-8e21-5c9a7d3b1f80"
version: 34
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Make the episode list usable on a long-running show. Seasons are collapsed and summarised by
    how many episodes still lack Japanese subtitles, rather than listing seventy episodes at once.
  - Show an episode's result underneath the episode. The panels sat at the foot of the page, so
    acting on something near the top sent its answer thousands of pixels away from the click.
  - Reduce each episode to two buttons. The two diagnostics are for when something looks wrong and
    now sit as quiet links instead of competing with the actions actually used.
