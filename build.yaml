version: 40
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Search for an OVA or special by its own name instead of asking for that number of the season.
    Jellyfin files these under season zero, where the first special is S00E01 and has nothing to do
    with episode one - which is what was being requested, and why episode one's subtitles kept
    coming back for an OVA.
  - Refuse a reference track that is on screen almost continuously. One release offered a track
    covering every second of the episode; a signal that is always on overlaps every alignment
    equally, so all seven candidates scored alike with uniqueness 1.00.
  - Collapse subtitle events written more than once. Multi-language scripts put each language on
    its own line at the same timestamp, which doubled the cue count and halved every coverage
    figure measured against it.
