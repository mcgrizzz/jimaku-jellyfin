version: 26
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Measure a subtitle's rate difference instead of only trying a fixed list of framerate ratios.
    The list covers the ratios standards conversion produces - 0.1% for NTSC pulldown, 4.17% for
    the PAL speedup - and nothing between them, so a drift of a few tenths of a percent could not
    be expressed at all. The search answered with a compromise offset that was right in the middle
    of the episode and seconds out at both ends. Aligning the front and back thirds separately
    gives the rate directly, with no grid involved.
