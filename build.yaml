version: 35
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Find episodes in a season Jimaku holds as two entries. A split cour airs as two runs, AniList
    gives each its own entry numbered from one, and Jellyfin shows the season numbered straight
    through - so the later episodes live in the second entry under different numbers, and asking
    the first for them found nothing at all.
  - Stop an AniList ID recorded on the series from overriding that. It names one entry, so it is
    right for the first cour and silently wrong for every episode after it; the mapping table,
    which knows a season can be two entries, now leads and the series ID is kept as a fallback.
  - Open season archives with the episode number that found the file rather than the one Jellyfin
    shows. For a split cour they differ, and the wrong number extracts a different episode.
