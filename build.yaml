name: "Jimaku"
guid: "9f1c2a3e-6d54-4b07-8e21-5c9a7d3b1f80"
version: 6
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Stop discarding candidates on filename score. A subtitle whose name shares nothing with
    your file is often the one that matches, and the old threshold skipped it entirely.
  - Choose the embedded subtitle track with the most cues as the timing reference, instead of
    the first one by language. A signs-only track made every candidate look untrustworthy.
  - Show the measured correlation, uniqueness and correction for each candidate checked.
