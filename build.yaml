version: 31
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Read every image-based subtitle track in one pass, keyed on the index ffprobe itself reports.
    Asking for one stream at a time meant trusting that the index the library reports is the index
    ffprobe uses; on one file that returned 318 cues for a track titled "Signs" and nothing at all
    for the one titled "Dialogue".
  - Judge a track by what it contains rather than by what it is called. Track titles are frequently
    wrong, and a warning based on the title alone cast doubt on the only usable track in the file.
    A signs track carries a few dozen cues; a dialogue track carries hundreds.
