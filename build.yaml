name: "Jimaku"
guid: "9f1c2a3e-6d54-4b07-8e21-5c9a7d3b1f80"
version: 30
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Show the reference's own cue times. Every number the plugin reports is measured against that
    reference, so when it is wrong they all agree with it and none of them can reveal the error.
    These can be checked against the episode itself: play it with that subtitle track on and see
    whether the times match.
