targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Say when a file is a recap the library has filed under the wrong number. An episode named 23.5
    airs between two episodes; Jellyfin reads the whole number and drops the fraction, so subtitles
    for episode 23 are fetched for an episode that is not 23. They download cleanly and never line
    up, and every measurement reports exactly what a wrong subtitle reports.
  - Ignore subtitle tracks far too dense to be speech. One file offered a reference of ten thousand
    cues - seven a second - against which every candidate scored alike and the choice between them
    was made on nothing.
  - Bound what "apply it anyway" is allowed to apply. Waiving verification says the evidence was
    thin, not that any answer will do: a hundred seconds of shift with the runtime stretched one
    and a half percent is the wrong episode, not a badly timed right one, and it was being written.
