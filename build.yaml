version: 29
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Fix drift correction failing to fire on the comparison it is most often needed for. The
    refinement was checked with a score computed differently from the one it had to beat, so it
    quietly declined; and it inherited the uncorrected fit's uniqueness, meaning a drift could be
    measured correctly and then rejected for the vagueness the correction had just removed. It also
    now measures repeatedly until it converges - one pass left half a second across an episode,
    which is the whole matching tolerance.
  - Always write a subtitle picked in a client's own subtitle dialog. That dialog cannot explain a
    refusal: the download just fails, with no reason and no way to override. The measured
    correction is applied when one was found.
  - Treat 1920x1080 and 1080p as the same resolution. Release names use both, and the disc-sourced
    candidate was losing a match it had earned to a stream rip that spelled it the other way.
  - Stop recording a trailing [sdh] or [cc] as a release group. It sits where a group tag sits and
    parses as one, and the series preference would have learned that a show is best served by the
    group "sdh".
