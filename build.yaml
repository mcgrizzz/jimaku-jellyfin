name: "Jimaku"
guid: "9f1c2a3e-6d54-4b07-8e21-5c9a7d3b1f80"
version: 36
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Stop rejecting correctly named files for using the season's numbering. Where Jimaku has already
    filtered by episode it has answered that question with a relations table this plugin cannot
    see - it knows a file called "14" and one called "Part 2 - E03" are the same episode, and
    returns both. Checking them again against one number threw away six of seven correct files.
  - Where the check is still needed, on a whole-entry listing the server did not filter, accept
    either numbering: the entry's own and the library's.
