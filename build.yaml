version: 28
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "andrew"
overview: "Japanese subtitles from Jimaku, timing-verified against your media"
description: >
  Finds Japanese subtitles for anime episodes on jimaku.cc, verifies the candidate
  against the local file's actual timing (embedded subtitle track, or voice activity
  in the Japanese audio), corrects constant offsets and framerate drift, and writes
  the result as an external .jpn.ass / .jpn.srt sidecar. Declines rather than guessing
  when confidence is low. (Requires a Jimaku API key.)
category: "Subtitles"
artifacts:
  - "Jellyfin.Plugin.Jimaku.dll"
  - "AnitomySharp.dll"
changelog: |-
  - Require a subtitle to actually name the same source before preferring it, rather than merely
    not naming a different one. A filename saying nothing about its origin produced the same "not
    mismatched" as one naming the right origin, so an untagged fansub was promoted over the disc
    release it was competing with, on a disc video.
  - Stop fabricating cue lengths when an image-based track reports none. Every cue was stretched to
    meet the next, turning the reference into one continuous block - and a reference that is on
    almost all the time correlates about equally well with everything, so every candidate scored
    alike and the choice between them came down to noise.
  - Report the reference's own shape: how many cues, how long they run, and how much of the episode
    it covers. A reference that looks fine and is useless is otherwise indistinguishable from a
    library full of bad subtitles.
